name: Deploy

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate

      - name: Verify backend
        working-directory: backend
        run: |
          npm run lint
          npm run type-check
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Verify Docker Compose config
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config

      - name: Verify backend Docker image build
        run: docker build -f backend/Dockerfile backend

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/iris_ec2
          chmod 600 ~/.ssh/iris_ec2

      - name: Deploy on EC2
        run: |
          ssh \
            -i ~/.ssh/iris_ec2 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<'EOF'
            set -e

            APP_DIR="$HOME/iris"
            LEGACY_APP_DIR="$HOME/hub"
            COMPOSE_PROJECT_NAME="hub"
            export COMPOSE_PROJECT_NAME

            echo ""
            echo "== Sync repository =="
            if [ ! -d "$APP_DIR/.git" ] && [ -d "$LEGACY_APP_DIR/.git" ]; then
              mv "$LEGACY_APP_DIR" "$APP_DIR"
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin deploy
            git reset --hard origin/deploy
            echo "== Sync repository completed =="

            echo ""
            echo "== Write production env =="
            cat > .env.production <<'ENVEOF'
          NODE_ENV=${{ secrets.NODE_ENV }}
          PORT=${{ secrets.PORT }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          ADMIN_WEB_URL=${{ secrets.ADMIN_WEB_URL }}
          ENVEOF

            chmod 600 .env.production
            echo "== Write production env completed =="

            echo ""
            echo "== Prepare swap =="
            if ! swapon --show | grep -q '^'; then
              if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
              fi

              sudo swapon /swapfile
            fi
            echo "== Prepare swap completed =="

            echo ""
            echo "== Start MySQL =="
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d mysql
            echo "== Start MySQL completed =="

            echo ""
            echo "== Build backend image =="
            docker compose --env-file .env.production -f docker-compose.prod.yml build backend
            echo "== Build backend image completed =="
            echo "== Backend image state =="
            docker compose --env-file .env.production -f docker-compose.prod.yml images backend || true
            docker image inspect hub-backend:latest --format 'latest image id={{.Id}} created={{.Created}}' || true

            echo ""
            echo "== Run Prisma migrations =="
            docker compose --env-file .env.production -f docker-compose.prod.yml run -T --rm --no-deps backend sh -lc 'npm run db:deploy' </dev/null &
            MIGRATION_PID=$!

            for i in $(seq 1 120); do
              if ! kill -0 "$MIGRATION_PID" 2>/dev/null; then
                break
              fi

              if [ $((i % 10)) -eq 0 ]; then
                echo "== Prisma migrations still running: ${i}s =="
                docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Command}}' | grep -E 'iris-backend|hub-backend|backend' || true
              fi

              sleep 1
            done

            if kill -0 "$MIGRATION_PID" 2>/dev/null; then
              echo "== Prisma migrations did not finish in time =="
              docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Command}}' || true
              docker logs iris-backend --tail 100 || true
              kill "$MIGRATION_PID" || true
              wait "$MIGRATION_PID" || true
              exit 1
            fi

            if ! wait "$MIGRATION_PID"; then
              echo "== Prisma migrations failed =="
              docker ps -a --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Command}}' || true
              exit 1
            fi

            echo "== Run Prisma migrations completed =="

            echo ""
            echo "== Start backend =="
            BACKEND_BEFORE_ID=$(docker inspect iris-backend --format '{{.Id}}' 2>/dev/null || true)
            BACKEND_BEFORE_IMAGE=$(docker inspect iris-backend --format '{{.Image}}' 2>/dev/null || true)
            BACKEND_BEFORE_STARTED=$(docker inspect iris-backend --format '{{.State.StartedAt}}' 2>/dev/null || true)
            echo "backend before id=${BACKEND_BEFORE_ID:-none}"
            echo "backend before image=${BACKEND_BEFORE_IMAGE:-none}"
            echo "backend before started=${BACKEND_BEFORE_STARTED:-none}"

            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --force-recreate backend

            BACKEND_AFTER_ID=$(docker inspect iris-backend --format '{{.Id}}' 2>/dev/null || true)
            BACKEND_AFTER_IMAGE=$(docker inspect iris-backend --format '{{.Image}}' 2>/dev/null || true)
            BACKEND_AFTER_STARTED=$(docker inspect iris-backend --format '{{.State.StartedAt}}' 2>/dev/null || true)
            echo "backend after id=${BACKEND_AFTER_ID:-none}"
            echo "backend after image=${BACKEND_AFTER_IMAGE:-none}"
            echo "backend after started=${BACKEND_AFTER_STARTED:-none}"

            if [ -n "$BACKEND_BEFORE_ID" ] && [ "$BACKEND_BEFORE_ID" = "$BACKEND_AFTER_ID" ]; then
              echo "Backend container was not recreated"
              docker compose --env-file .env.production -f docker-compose.prod.yml ps
              exit 1
            fi

            echo "== Start backend completed =="

            echo ""
            echo "== Prune Docker images =="
            docker image prune -f
            echo "== Prune Docker images completed =="

            echo ""
            echo "== Check backend health =="
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                break
              fi

              docker logs iris-backend --tail 80 || true
              sleep 3
            done

            curl -fsS http://127.0.0.1:3000/api/health
            echo "== Direct backend health completed =="

            echo ""
            echo "== Check Nginx API proxy health =="
            curl -fsS http://127.0.0.1/api/health || {
              sudo tail -100 /var/log/nginx/error.log || true
              sudo nginx -T | sed -n '1,220p' || true
              exit 1
            }
            echo "== Check Nginx API proxy health completed =="
          EOF

      - name: Health check
        run: |
          echo ""
          echo "== Check external backend health =="
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://${{ secrets.EC2_HOST }}/api/health
          echo "== Check external backend health completed =="

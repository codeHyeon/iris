name: Deploy

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate

      - name: Verify backend
        working-directory: backend
        run: |
          npm run lint
          npm run type-check
          npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Verify Docker Compose config
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config

      - name: Verify backend Docker image build
        run: docker build -f backend/Dockerfile backend

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/iris_ec2
          chmod 600 ~/.ssh/iris_ec2

      - name: Deploy on EC2
        run: |
          ssh \
            -i ~/.ssh/iris_ec2 \
            -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} <<'EOF'
            set -e

            APP_DIR="$HOME/hub"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone git@github.com:${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin deploy
            git reset --hard origin/deploy

            cat > .env.production <<'ENVEOF'
          NODE_ENV=${{ secrets.NODE_ENV }}
          PORT=${{ secrets.PORT }}
          BACKEND_PORT=${{ secrets.BACKEND_PORT }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER=${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
          ADMIN_WEB_URL=${{ secrets.ADMIN_WEB_URL }}
          ENVEOF

            chmod 600 .env.production

            if ! swapon --show | grep -q '^'; then
              if [ ! -f /swapfile ]; then
                sudo fallocate -l 2G /swapfile
                sudo chmod 600 /swapfile
                sudo mkswap /swapfile
              fi

              sudo swapon /swapfile
            fi

            echo "== Start MySQL =="
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d mysql

            echo "== Build backend image =="
            docker compose --env-file .env.production -f docker-compose.prod.yml build backend

            echo "== Wait for MySQL =="
            MYSQL_READY=0
            for i in $(seq 1 30); do
              if docker compose --env-file .env.production -f docker-compose.prod.yml exec -T mysql mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; then
                MYSQL_READY=1
                break
              fi

              sleep 2
            done

            if [ "$MYSQL_READY" -ne 1 ]; then
              echo "MySQL did not become ready in time"
              docker logs iris-mysql-prod --tail 100 || true
              exit 1
            fi

            echo "== Grant MySQL permissions =="
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T mysql sh -lc 'printf "CREATE USER IF NOT EXISTS '\''%s'\''@'\''%%'\'' IDENTIFIED BY '\''%s'\''; ALTER USER '\''%s'\''@'\''%%'\'' IDENTIFIED BY '\''%s'\''; GRANT ALL PRIVILEGES ON %s.* TO '\''%s'\''@'\''%%'\''; FLUSH PRIVILEGES;" "$MYSQL_USER" "$MYSQL_PASSWORD" "$MYSQL_USER" "$MYSQL_PASSWORD" "$MYSQL_DATABASE" "$MYSQL_USER" | mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'

            echo "== Run Prisma migrations =="
            docker compose --env-file .env.production -f docker-compose.prod.yml run --rm backend npm run db:deploy

            echo "== Verify database schema =="
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T mysql sh -lc 'mysql -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" "$MYSQL_DATABASE" -e "SHOW TABLES LIKE '\''notice_sites'\'';" | grep -q notice_sites'

            echo "== Start backend =="
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d backend

            echo "== Prune Docker images =="
            docker image prune -f

            echo "== Check backend health =="
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:3000/api/health; then
                break
              fi

              docker logs iris-backend --tail 80 || true
              sleep 3
            done

            curl -fsS http://127.0.0.1:3000/api/health
            curl -fsS http://127.0.0.1/api/health || {
              sudo tail -100 /var/log/nginx/error.log || true
              sudo nginx -T | sed -n '1,220p' || true
              exit 1
            }
          EOF

      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://${{ secrets.EC2_HOST }}/api/health
